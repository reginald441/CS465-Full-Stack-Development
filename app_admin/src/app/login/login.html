<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h3 mb-3">Admin Sign In</h1>
    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" formControlName="email">
        <div class="text-danger" *ngIf="submitted && loginForm.controls.email.invalid">
          Enter a valid email address.
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" type="password" formControlName="password">
        <div class="text-danger" *ngIf="submitted && loginForm.controls.password.invalid">
          Password is required.
        </div>
      </div>
      <button class="btn btn-primary w-100" type="submit">Sign In</button>
    </form>
  </div>
</div>
