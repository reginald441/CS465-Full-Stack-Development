<div class="col-md-4">
  <h1>Edit Trip</h1>

  <form [formGroup]="editForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Trip Code</label>
      <input
        type="text"
        formControlName="code"
        placeholder="Code"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['code'].errors }">

      <div *ngIf="submitted && f['code'].errors" class="invalid-feedback">
        <div *ngIf="f['code'].errors['required']">
          Trip Code is required
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Name</label>
      <input
        type="text"
        formControlName="name"
        placeholder="Name"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
    </div>

    <div class="form-group">
      <label>Length</label>
      <input
        type="text"
        formControlName="length"
        placeholder="Length"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['length'].errors }">
    </div>

    <div class="form-group">
      <label>Start</label>
      <input
        type="text"
        formControlName="start"
        placeholder="Start Date"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['start'].errors }">
    </div>

    <div class="form-group">
      <label>Resort</label>
      <input
        type="text"
        formControlName="resort"
        placeholder="Resort"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }">
    </div>

    <div class="form-group">
      <label>Price Per Person</label>
      <input
        type="text"
        formControlName="perPerson"
        placeholder="Price Per Person"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }">
    </div>

    <div class="form-group">
      <label>Image</label>
      <input
        type="text"
        formControlName="image"
        placeholder="Image"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['image'].errors }">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea
        rows="6"
        formControlName="description"
        placeholder="Description"
        class="form-control"
        [ngClass]="{ 'is-invalid': submitted && f['description'].errors }">
      </textarea>
    </div>

    <br>

    <button class="btn btn-primary" type="submit">
      Save Changes
    </button>

    &nbsp;

    <button class="btn btn-secondary" routerLink="/">
      Cancel
    </button>

  </form>
</div>
